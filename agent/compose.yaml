# Sobe no notebook host-linux (192.168.56.20 é só o IP de exemplo).
# Publica o Agent 2 na porta 10050 dessa máquina.
# Coleta passiva: só 192.168.56.10 pode consultar o agente.

services:
  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    environment:
      ZBX_HOSTNAME: host-linux
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_IP:-192.168.56.10}
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "false"
    ports:
      - "10050:10050"
    init: true
    restart: unless-stopped
