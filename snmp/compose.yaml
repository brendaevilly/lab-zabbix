# Sobe no notebook dispositivo-rede (192.168.56.30 é só o IP de exemplo).
# A máquina oferece SNMP na porta 161/UDP.
# O snmpd escuta em 1161: publicar 161:161 impede o processo de abrir o socket.

services:
  snmpd:
    build: .
    image: zabbix-lab-snmp
    ports:
      - "161:1161/udp"
    volumes:
      - ./snmpd.conf:/etc/snmp/snmpd.conf:ro
    restart: unless-stopped
