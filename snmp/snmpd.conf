# Equipamento de rede do laboratorio. Escuta na porta publicada 161/UDP.
# A comunidade so responde ao IP do notebook do Zabbix Server.
# O processo escuta em 1161. O Compose publica essa porta como 161 no notebook.
# udp:161 abre IPv6 e, no Docker, a porta 161 de dentro do container ja fica ocupada pela publicacao.

agentAddress udp:0.0.0.0:1161

sysName dispositivo-rede
sysLocation Laboratorio de gerencia de redes
sysContact lab@gerencia-de-redes.local

view labview included .1.3.6.1.2.1
rocommunity zabbixlab 192.168.56.10 -V labview
