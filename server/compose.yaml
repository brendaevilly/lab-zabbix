# Sobe no notebook zabbix-server.
# O IP 192.168.56.10 nos outros arquivos é exemplo; use o IPv4 desta máquina.
# mysql e zabbix-server ficam na rede interna do Compose.
# A interface sai na porta 8080 desta máquina.

services:
  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-zabbixlab-root}
      MARIADB_DATABASE: zabbix
      MARIADB_USER: zabbix
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-zabbixlab}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zabbixlab}
    cap_add:
      - NET_RAW
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/10051"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    init: true
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zabbixlab}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  mysql-data:
